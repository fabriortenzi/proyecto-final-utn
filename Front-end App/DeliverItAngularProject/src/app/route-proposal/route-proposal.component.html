<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
/>

<nav class="navbar">
  <div class="container-menu">
    <span class="material-symbols-rounded" routerLink="/start-delivery"
      >arrow_back</span
    >
  </div>
  <h2 class="nav-title">Ruta Propuesta</h2>
</nav>

<div class="timer-container">
  <span class="timer-label">Tiempo restante:</span>
  <span class="timer-value" [class.timer-low]="isTimeLow()">
    {{ formatTime(remainingSeconds) }}
  </span>
</div>

<div class="map-container" *ngIf="mapLoaded">
  <google-map
    [center]="center"
    [zoom]="zoom"
    width="100%"
    height="300px"
  >
    <map-marker
      *ngFor="let marker of markers"
      [position]="marker.position"
      [label]="marker.label"
      [title]="marker.title"
    ></map-marker>
  </google-map>
</div>

<div class="stops-list">
  <div class="stop-card" *ngFor="let stop of route?.stops; let i = index">
    <div class="stop-number">{{ i + 1 }}</div>
    <div class="stop-info">
      <div class="stop-type">
        <ion-icon
          [name]="stop.type === 'pickup' ? 'storefront-outline' : 'location-outline'"
        ></ion-icon>
        <span class="stop-type-label">
          {{ stop.type === 'pickup' ? 'Recoger' : 'Entregar' }}
        </span>
      </div>
      <p class="stop-name">
        {{ stop.type === 'pickup' ? 'Recoger en: ' + stop.shopName : 'Entregar a: ' + stop.clientName }}
      </p>
      <p class="stop-address">{{ stop.address }}</p>
    </div>
  </div>
</div>

<div class="error-message-show" *ngIf="errorMessage">
  <ion-icon name="alert-circle-outline"></ion-icon>
  <span>{{ errorMessage }}</span>
</div>

<div class="actions">
  <div class="confirm-button" *ngIf="!confirming">
    <app-primary-button
      title="Confirmar Ruta"
      (buttonClicked)="confirmRoute()"
    ></app-primary-button>
  </div>
  <div class="confirm-button" *ngIf="confirming">
    <mat-spinner diameter="36"></mat-spinner>
  </div>

  <button class="secondary-button reject-button" (click)="rejectRoute()" [disabled]="rejecting">
    {{ rejecting ? 'Rechazando...' : 'Rechazar' }}
  </button>
</div>
