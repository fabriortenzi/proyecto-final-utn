<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<nav class="navbar-compact">
  <span class="material-symbols-outlined" (click)="goBack()">arrow_back</span>
</nav>
<h2 class="page-header">Entrega en Curso</h2>

<div class="map-container" *ngIf="mapLoaded">
  <google-map
    [center]="center"
    [zoom]="zoom"
    width="100%"
    height="280px"
  >
    <map-marker
      *ngFor="let marker of markers"
      [position]="marker.position"
      [label]="marker.label"
      [title]="marker.title"
    ></map-marker>
  </google-map>
</div>

<div class="stops-stack">
  <div
    class="stop-card"
    *ngFor="let stop of route?.stops; let i = index"
    [class.stop-completed]="isStopCompleted(i)"
    [class.stop-active]="isStopActive(i)"
    [class.stop-future]="!isStopCompleted(i) && !isStopActive(i)"
  >
    <div class="stop-header">
      <div class="stop-number" [class.stop-number-completed]="isStopCompleted(i)">
        <span *ngIf="!isStopCompleted(i)">{{ i + 1 }}</span>
        <span class="material-symbols-rounded check-icon" *ngIf="isStopCompleted(i)"
          >check</span
        >
      </div>
      <div class="stop-info">
        <div class="stop-type">
          <ion-icon
            [name]="stop.type === 'pickup' ? 'storefront-outline' : 'location-outline'"
          ></ion-icon>
          <span class="stop-type-label">
            {{ stop.type === 'pickup' ? 'Recoger' : 'Entregar' }}
          </span>
        </div>
        <p class="stop-name">
          {{ stop.type === 'pickup' ? stop.shopName : stop.clientName }}
        </p>
        <p class="stop-address">{{ stop.address }}</p>
      </div>
    </div>

    <div class="stop-action" *ngIf="isStopActive(i)">
      <button
        class="complete-button"
        (click)="completeStop()"
        [disabled]="completing"
      >
        <mat-spinner *ngIf="completing" diameter="20"></mat-spinner>
        <span *ngIf="!completing">{{ getStopButtonText(stop) }}</span>
      </button>
    </div>
  </div>
</div>

<div class="error-message-show" *ngIf="errorMessage">
  <ion-icon name="alert-circle-outline"></ion-icon>
  <span>{{ errorMessage }}</span>
</div>

<div class="success-overlay" *ngIf="allCompleted">
  <div class="success-content">
    <span class="material-symbols-rounded success-icon">check_circle</span>
    <h2>Todas las entregas fueron completadas!</h2>
    <p>Redirigiendo al inicio...</p>
  </div>
</div>
