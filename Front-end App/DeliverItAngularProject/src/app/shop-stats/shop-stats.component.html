<head>
    <link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdn.plot.ly/plotly-2.29.1.min.js" charset="utf-8"></script>
</head>
<body>
    <nav class="navbar-compact">
      <span class="material-symbols-outlined" (click)="goBack()">arrow_back</span>
    </nav>
    <h1 class="page-header">Estadísticas del local</h1>
    <div class="monthCardContainer">
        <h3 id="actualMonthText">Mes actual</h3>
        <h6 id="actualMonth">{{this.date}}</h6>
    </div>
    <div class="amountCardContainer">
        <h3 id="totalAmountText">Monto total recaudado</h3>
        <h2 id="totalSellAmount">ARS$ {{this.stats.totalSellAmount}}</h2>
    </div>
    <div class="filterContainer">
        <button class="filterButton" (click)="toggleDropdown()">
            <span>Filtrar por categorías</span>
            <span class="material-symbols-rounded">expand_more</span>
        </button>
        <div class="dropdownPanel" *ngIf="showDropdown">
            <label class="checkboxItem" *ngFor="let cat of categories">
                <input type="checkbox" [value]="cat.id" (change)="onCategoryToggle(cat.id!, $event)" />
                {{ cat.description }}
            </label>
            <div class="dropdownEmpty" *ngIf="categories.length === 0">
                No hay categorías disponibles
            </div>
        </div>
    </div>
    <div class="chartContainer lineChartContainer">
        <div class="chartTitleContainer">
            <h3>Evolución de ventas</h3>
        </div>
        <div id="lineChart" style="width:350px; height: 300px;"></div>
    </div>
    <div class="separator"></div>
    <div class="chartContainer">
        <div class="chartTitleContainer">
            <h3>Productos más vendidos (en unidades)</h3>
        </div>
        <div id="barChart" style="width:350px; height: 300px;"></div>
    </div>
</body>
