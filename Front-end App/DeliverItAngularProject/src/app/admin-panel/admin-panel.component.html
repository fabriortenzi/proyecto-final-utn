<div class="admin-header">
  <h2 class="greeting">Hola, {{ loggedUser.name }} {{ loggedUser.surname }}!</h2>
  <h6 class="subtitle">Panel de Administraci&oacute;n</h6>
</div>

<div class="options-container">
  <div class="options" (click)="onUserManagement()">
    <div class="center">
      <div class="buttons_logos">
        <ion-icon name="people-outline"></ion-icon>
      </div>
      <div class="button_text">
        <p id="add_prod_text">Gesti&oacute;n de Usuarios</p>
      </div>
    </div>
  </div>
</div>

<div class="options-container">
  <div class="options" (click)="onAddCommissionPercentage()">
    <div class="center">
      <div class="buttons_logos">
        <img id="plus_icon" src="assets\buttons_logos\plus_sign_icon.png" alt="plus_sign_icon">
      </div>
      <div class="button_text">
        <p id="add_prod_text">Agregar porcentaje de comisi&oacute;n</p>
      </div>
    </div>
  </div>
  <div class="options" (click)="onEditCommissionPercentage()">
    <div class="center">
      <div class="buttons_logos">
        <img id="pencil_icon" src="assets\buttons_logos\pencil_edit_icon.png" alt="plus_sign_icon">
      </div>
      <div class="button_text">
        <p id="add_prod_text">Editar porcentaje de comisi&oacute;n</p>
      </div>
    </div>
  </div>
    <div class="options" (click)="onRegisterPasskey()">
      <div class="center">
        <div class="buttons_logos">
          <ion-icon name="finger-print-outline"></ion-icon>
        </div>
        <div class="button_text">
          <p id="add_prod_text">Configurar datos biom&eacute;tricos</p>
        </div>
      </div>
    </div>
    <div class="options logout-button" (click)="logout()">
      <div class="center">
        <div class="buttons_logos">
          <img id="pencil_icon" src="assets\buttons_logos\logout_icon.png" alt="stats_icon" />
        </div>
        <div class="button_text">
          <p id="add_prod_text">Cerrar sesi&oacute;n</p>
        </div>
      </div>
    </div>
</div>
