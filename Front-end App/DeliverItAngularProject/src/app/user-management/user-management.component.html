<div class="user-management-container">
  <h2 class="page-title">Gesti&oacute;n de Usuarios</h2>

  <div class="filters-container">
    <mat-form-field appearance="outline" class="email-filter">
      <mat-label>Filtrar por email</mat-label>
      <input matInput [(ngModel)]="emailFilter" (input)="applyFilters()" placeholder="Buscar email...">
    </mat-form-field>

    <mat-form-field appearance="outline" class="role-filter">
      <mat-label>Rol</mat-label>
      <mat-select [(value)]="roleFilter" (selectionChange)="applyFilters()">
        <mat-option value="all">Todos</mat-option>
        <mat-option value="client">Clientes</mat-option>
        <mat-option value="owner">Owners</mat-option>
        <mat-option value="delivery">Repartidores</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="table-container mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort class="responsive-table">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let user">{{ user.name }}</td>
      </ng-container>

      <ng-container matColumnDef="surname">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Apellido</th>
        <td mat-cell *matCellDef="let user">{{ user.surname }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <ng-container matColumnDef="userType">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Rol</th>
        <td mat-cell *matCellDef="let user">{{ user.userType.description }}</td>
      </ng-container>

      <ng-container matColumnDef="enabled">
        <th mat-header-cell *matHeaderCellDef>Habilitado</th>
        <td mat-cell *matCellDef="let user">
          <mat-slide-toggle
            [checked]="user.enabled"
            (toggleChange)="toggleEnabled(user)"
            color="primary">
          </mat-slide-toggle>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" [pageSize]="10" showFirstLastButtons></mat-paginator>
  </div>
</div>
