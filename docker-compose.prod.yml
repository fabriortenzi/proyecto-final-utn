services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - "./Back-end App/dbSeed.js:/docker-entrypoint-initdb.d/seed.js:ro"

  backend:
    build:
      context: .
      dockerfile: Back-end App/Dockerfile.prod
      args:
        GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_URL=mongodb://mongodb:27017/deliverit
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - API_PORT=3000
      - CLOUDINARY_URL=${CLOUDINARY_URL:-}
      - GOOGLE_MAPS_API_KEY_BACKEND=${GOOGLE_MAPS_API_KEY_BACKEND:-}
      - RECOMMENDER_URL=http://recommender:8001
      - MERCADO_PAGO_ACCESS_TOKEN=${MERCADO_PAGO_ACCESS_TOKEN:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-}
    depends_on:
      - mongodb

  recommender:
    build:
      context: ./Back-end App/recommender
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=deliver_it
      - MODEL_PATH=/app/saved_model
    volumes:
      - recommender_model:/app/saved_model
    depends_on:
      - mongodb

  recommender-trainer:
    build:
      context: ./Back-end App/recommender
      dockerfile: Dockerfile.trainer
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=deliver_it
      - MODEL_PATH=/app/saved_model
    volumes:
      - recommender_model:/app/saved_model
    depends_on:
      - mongodb
      - recommender

volumes:
  mongodb_data:
  recommender_model:
