services:
  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
      - './Back-end App/dbSeed.js:/docker-entrypoint-initdb.d/seed.js:ro'

  backend:
    build:
      context: ./Back-end App
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    volumes:
      - './Back-end App/src:/app/src'
      - backend_node_modules:/app/node_modules
    environment:
      - DB_URL=mongodb://mongodb:27017/deliverit
      - JWT_SECRET_KEY=dev-secret-key
      - API_PORT=3000
      - API_SERVER=localhost
      - CLOUDINARY_URL=${CLOUDINARY_URL:-}
      - GOOGLE_MAPS_API_KEY_BACKEND=${GOOGLE_MAPS_API_KEY_BACKEND:-}
      - RECOMMENDER_URL=http://recommender:8001
      - MERCADO_PAGO_ACCESS_TOKEN=${MERCADO_PAGO_ACCESS_TOKEN:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
    entrypoint: /bin/sh -c "printenv | grep -E '^(DB_URL|JWT_SECRET_KEY|API_PORT|API_SERVER|CLOUDINARY_URL|GOOGLE_MAPS_API_KEY_BACKEND|RECOMMENDER_URL|MERCADO_PAGO_ACCESS_TOKEN|FRONTEND_URL)=' > .env.development && exec npm run start:dev"
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./Front-end App/DeliverItAngularProject
      dockerfile: Dockerfile.dev
    ports:
      - '4200:4200'
    volumes:
      - './Front-end App/DeliverItAngularProject/src:/app/src'
      - frontend_node_modules:/app/node_modules
    environment:
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
    entrypoint: ['/bin/sh', '/app/entrypoint.dev.sh']
    depends_on:
      - backend

  recommender:
    build: ./Back-end App/recommender
    ports:
      - '8001:8001'
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=deliver_it
      - MODEL_PATH=/app/saved_model
    volumes:
      - recommender_model:/app/saved_model
    depends_on:
      - mongodb

volumes:
  mongodb_data:
  backend_node_modules:
  frontend_node_modules:
  recommender_model:
